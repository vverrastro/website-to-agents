[project]
name = "wta-indexing"
version = "0.1.0"
description = "Extraction, chunking, embeddings, indexing worker"
requires-python = ">=3.12"
dependencies = [
  "wta-common",
  "wta-crawler",
  "trafilatura>=2.0",
  "lxml>=5.3",
  "arq>=0.26",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wta_indexing"]
