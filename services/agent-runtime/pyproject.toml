[project]
name = "wta-agent-runtime"
version = "0.1.0"
description = "Retrieval and LLM orchestration"
requires-python = ">=3.12"
dependencies = [
  "wta-common",
  "wta-indexing",
  "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wta_agent_runtime"]
